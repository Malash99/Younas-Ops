<\!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UW-TransVO Training Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: white;
            margin: 0;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .status-value {
            font-size: 2em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .status-training { color: #4CAF50; }
        .status-idle { color: #FFC107; }
        .status-error { color: #F44336; }
        
        .progress-bar {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #4CAF50;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌊 UW-TransVO Training Dashboard</h1>
        <div id="status-indicator">
            <span id="status-text">Connecting...</span>
        </div>
    </div>
    
    <div class="status-grid">
        <div class="status-card">
            <h3>Training Status</h3>
            <div class="status-value" id="training-status">Idle</div>
        </div>
        
        <div class="status-card">
            <h3>Current Epoch</h3>
            <div class="status-value" id="current-epoch">0</div>
            <div id="total-epochs">/ 0</div>
        </div>
        
        <div class="status-card">
            <h3>Current Loss</h3>
            <div class="status-value" id="current-loss">0.000</div>
        </div>
        
        <div class="status-card">
            <h3>ATE Loss</h3>
            <div class="status-value" id="ate-loss">0.000</div>
        </div>
        
        <div class="status-card">
            <h3>Final Drift</h3>
            <div class="status-value" id="final-drift">0.00m</div>
        </div>
        
        <div class="status-card">
            <h3>GPU Memory</h3>
            <div class="status-value" id="gpu-memory">0.0GB</div>
        </div>
    </div>
    
    <div class="status-card">
        <h3>Training Progress</h3>
        <div class="progress-bar">
            <div class="progress-fill" id="epoch-progress" style="width: 0%"></div>
        </div>
        <div id="batch-info">Batch 0 / 0</div>
        <div id="learning-rate">LR: 0.0000</div>
    </div>

    <script>
        const socket = io();
        
        function updateStatus(data) {
            document.getElementById("training-status").textContent = data.status || "Unknown";
            document.getElementById("training-status").className = "status-" + data.status;
            
            document.getElementById("current-epoch").textContent = data.epoch || 0;
            document.getElementById("total-epochs").textContent = "/ " + (data.total_epochs || 0);
            
            document.getElementById("current-loss").textContent = (data.loss || 0).toFixed(6);
            document.getElementById("ate-loss").textContent = (data.ate_loss || 0).toFixed(6);
            document.getElementById("final-drift").textContent = (data.final_drift_m || 0).toFixed(3) + "m";
            document.getElementById("gpu-memory").textContent = (data.gpu_memory || 0).toFixed(1) + "GB";
            
            document.getElementById("batch-info").textContent = "Batch " + (data.batch || 0) + " / " + (data.total_batches || 0);
            document.getElementById("learning-rate").textContent = "LR: " + (data.lr || 0).toFixed(6);
            
            const epochProgress = data.total_epochs > 0 ? ((data.epoch || 0) / data.total_epochs) * 100 : 0;
            document.getElementById("epoch-progress").style.width = epochProgress + "%";
        }
        
        socket.on("connect", function() {
            document.getElementById("status-text").textContent = "Connected ✅";
            document.getElementById("status-text").style.color = "#4CAF50";
        });
        
        socket.on("disconnect", function() {
            document.getElementById("status-text").textContent = "Disconnected ❌";
            document.getElementById("status-text").style.color = "#F44336";
        });
        
        socket.on("training_update", function(data) {
            console.log("Training update:", data);
            updateStatus(data);
        });
        
        socket.on("epoch_complete", function(data) {
            console.log("Epoch completed:", data);
            updateStatus(data);
        });
    </script>
</body>
</html>
